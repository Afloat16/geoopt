name: Validate GIST float32 gradient accuracy

on:
  push:
    branches: [validation/st-gist-oracle-20261116]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.6.0', '2.14.1']
    defaults:
      run:
        working-directory: project
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      PYTHONPATH: .
      ST_BASE: 9ac7fdb4edce2f1dbc171b036ecbb60383653e74
      ST_CANDIDATE: bb300ecbd87fa6a8a449118fb45cadac2ce4a6eb
      ST_SOURCES: sentence_transformers/sentence_transformer/losses/gist_embed.py sentence_transformers/sentence_transformer/losses/cached_gist_embed.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/sentence-transformers
          ref: bb300ecbd87fa6a8a449118fb45cadac2ce4a6eb
          path: project
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 transformers==5.23.0 huggingface-hub==2.4.0 datasets==5.2.0 accelerate==1.15.0 pytest==9.2.0 pytest-env pytest-subtests pre-commit socksio pillow
          python -m pip install -e . --no-deps
      - name: Verify and benchmark unchanged baseline
        run: |
          test "$(git rev-parse HEAD)" = "$ST_CANDIDATE"
          for source in $ST_SOURCES; do git show "$ST_BASE:$source" > "$source"; done
          python -m pytest tests/sentence_transformer/losses/test_gist_similarity_matrix.py tests/sentence_transformer/losses/test_gist_embed.py tests/sentence_transformer/losses/test_cached_gist_embed.py -q --tb=short
          python ../harness/.validation/st-gist-cosine-benchmark.py before
      - name: Verify numerical error, regressions and benchmark candidate
        run: |
          git restore --source="$ST_CANDIDATE" -- $ST_SOURCES
          python ../harness/.validation/st-gist-precision-diagnostic.py
          python -m pytest tests/sentence_transformer/losses/test_gist_similarity_matrix.py tests/sentence_transformer/losses/test_gist_embed.py tests/sentence_transformer/losses/test_cached_gist_embed.py -q --tb=short
          python ../harness/.validation/st-gist-cosine-benchmark.py after before
      - name: Check repository style
        run: |
          pre-commit run --all-files
          git diff --exit-code
          git diff --check
