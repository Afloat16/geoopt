name: Kornia Hausdorff precision and eager contract validation
on:
  push:
    branches: [validation/kornia-hausdorff-precision-20261116]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.5.1', '2.15.0']
    env:
      CUDA_VISIBLE_DEVICES: ''
      KORNIA_TEST_OPTIMIZER: ''
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/kornia
          ref: ec3b52d4c10f1439e3b72436896fd3ac2bfbac6b
          path: kornia
          fetch-depth: 2
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          working-directory: kornia
          environments: py312
          locked: true
          cache: true
      - name: Install locked packages and CPU Torch
        working-directory: kornia
        env:
          TORCH_VERSION: ${{ matrix.torch }}
        run: pixi run -e py312 python ../validation/.validation/kornia-install-locked-cpu.py
      - name: Verify baseline, dtype and override contracts, and public call cost
        working-directory: kornia
        run: pixi run -e py312 uv run --no-sync python ../validation/.validation/kornia-hausdorff-validate.py
      - name: Run affected standard precision eager tests
        working-directory: kornia
        run: pixi run -e py312 uv run --no-sync pytest tests/losses/test_hd.py --device=cpu --dtype=float32,float64 -k "not jit and not compile and not dynamo and not onnx and not trace and not export" -q
      - name: Run affected half precision eager tests
        working-directory: kornia
        run: pixi run -e py312 uv run --no-sync pytest tests/losses/test_hd.py --device=cpu --dtype=float16,bfloat16 -k "not jit and not compile and not dynamo and not onnx and not trace and not export" -q
      - name: Full pre-commit
        if: always() && matrix.torch == '2.15.0'
        working-directory: kornia
        run: pixi run -e py312 uv run --no-sync pre-commit run --all-files
      - name: Typecheck
        if: always() && matrix.torch == '2.15.0'
        working-directory: kornia
        run: pixi run -e py312 typecheck
      - name: Check tracked files remain exact
        if: always()
        working-directory: kornia
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kornia-hausdorff-precision-${{ matrix.torch }}
          path: kornia-hausdorff-validation-results/
