name: Validate Siegel inner product solves
on:
  push:
    branches: ['validation/siegel-inner-direct-solves-20261116']
permissions:
  contents: read
jobs:
  correctness-and-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest ruff
      - name: Use one CPU thread for numerical tests and measurements
        run: |
          echo OMP_NUM_THREADS=1 >> "$GITHUB_ENV"
          echo MKL_NUM_THREADS=1 >> "$GITHUB_ENV"
      - name: Check the candidate files
        run: python -m ruff check geoopt/manifolds/siegel/upper_half.py geoopt/manifolds/siegel/bounded_domain.py tests/test_siegel_inner_solves.py
      - name: Verify and measure unchanged upstream
        run: |
          git fetch --depth=1 origin 4623ea1d2a9808b8e87bf10949cccb2c5ec6233c
          git restore --source=4623ea1d2a9808b8e87bf10949cccb2c5ec6233c -- geoopt/manifolds/siegel/upper_half.py geoopt/manifolds/siegel/bounded_domain.py
          python -m pytest -q tests/test_siegel_inner_solves.py --junitxml=baseline.xml
          python validation/benchmark_siegel_inner_solves.py baseline.json
      - name: Verify and measure the exact candidate
        run: |
          git fetch --depth=1 origin d1ea20de7503e688f3b37b32b92845a9c101a221
          git restore --source=d1ea20de7503e688f3b37b32b92845a9c101a221 -- geoopt/manifolds/siegel/upper_half.py geoopt/manifolds/siegel/bounded_domain.py
          python -m pytest -q tests/test_siegel_inner_solves.py tests/test_manifold_basic.py --junitxml=candidate.xml
          python validation/benchmark_siegel_inner_solves.py candidate.json
          git diff --exit-code
      - name: Compare timings
        run: |
          python - <<'PY'
          import json
          baseline = json.load(open("baseline.json"))["results"]
          candidate = json.load(open("candidate.json"))["results"]
          for before, after in zip(baseline, candidate):
              keys = ("model", "backward", "batch", "size", "norm")
              assert tuple(before[key] for key in keys) == tuple(after[key] for key in keys)
              print(json.dumps({"case": {key: before[key] for key in keys}, "before_ms": before["median_ms"], "after_ms": after["median_ms"], "speedup": before["median_ms"] / after["median_ms"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siegel-inner-solves-results
          path: |
            baseline.xml
            candidate.xml
            baseline.json
            candidate.json
