name: Validate sentence-transformers retrieval and ranking fixes

on:
  push:
    branches: [validation/st-core-1-2-20261116]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: faiss
            sha: ceba445678cdbda149cac7e8090d329f017e2d34
            source: sentence_transformers/util/quantization.py
            regression: tests/util/test_faiss_batch_reconstruction.py
          - candidate: lambda
            sha: 7bc2a876eb80b7a246fafbe7f9425691d97314cd
            source: sentence_transformers/cross_encoder/losses/lambda_loss.py
            regression: tests/cross_encoder/losses/test_lambda_gain_precision.py
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      PYTHONPATH: .
      ST_BASE: 9ac7fdb4edce2f1dbc171b036ecbb60383653e74
      ST_CANDIDATE: ${{ matrix.sha }}
      ST_SOURCE: ${{ matrix.source }}
      ST_REGRESSION: ${{ matrix.regression }}
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/sentence-transformers
          ref: ${{ matrix.sha }}
          path: project
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 transformers==5.23.0 huggingface-hub==2.4.0 datasets==5.2.0 accelerate==1.15.0 faiss-cpu==1.16.0 usearch==2.26.6 pytest==9.2.0 pytest-env pytest-subtests pre-commit socksio
          python -m pip install -e . --no-deps
      - name: Verify immutable revisions and baseline behavior
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ST_CANDIDATE"
          git show "$ST_BASE:$ST_SOURCE" > "$ST_SOURCE"
          set +e
          python -m pytest "$ST_REGRESSION" -q --tb=no --junitxml=baseline.xml
          st_baseline_status=$?
          set -e
          python - "${{ matrix.candidate }}" "$st_baseline_status" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          result = ET.parse('baseline.xml').getroot().find('testsuite')
          counts = {k: int(result.attrib[k]) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('UNCHANGED BASELINE:', counts, 'exit', sys.argv[2])
          expected = {'tests': 13, 'failures': 0, 'errors': 0, 'skipped': 0} if sys.argv[1] == 'faiss' else {'tests': 242, 'failures': 98, 'errors': 0, 'skipped': 0}
          assert counts == expected
          assert int(sys.argv[2]) == (0 if sys.argv[1] == 'faiss' else 1)
          PY
      - name: Measure baseline full retrieval
        if: matrix.candidate == 'faiss'
        run: python ../validation/.validation/st-faiss-benchmark.py --output ../validation/faiss-baseline.json
      - name: Restore candidate and run relevant tests
        run: |
          git restore --source="$ST_CANDIDATE" -- "$ST_SOURCE"
          python -m pytest "$ST_REGRESSION" -q --tb=short
          if [ "${{ matrix.candidate }}" = faiss ]; then
            python -m pytest tests/util/test_quantization.py tests/util/test_faiss_batch_reconstruction.py -q --tb=short
            python -m pytest tests/util/test_retrieval.py -k semantic_search -q --tb=short
          else
            python -m pytest tests/cross_encoder/losses/test_misc.py tests/cross_encoder/losses/test_lambda_gain_precision.py -q --tb=short
          fi
      - name: Measure candidate full retrieval and compare every result
        if: matrix.candidate == 'faiss'
        run: |
          python ../validation/.validation/st-faiss-benchmark.py --output ../validation/faiss-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('../validation/faiss-baseline.json').read_text())['records']
          after = json.loads(Path('../validation/faiss-candidate.json').read_text())['records']
          for base, candidate in zip(before, after):
              assert base['result_sha256'] == candidate['result_sha256']
              print('RESULTS IDENTICAL:', base['corpus'], 'corpus vectors;', 'speed ratio', base['median_seconds'] / candidate['median_seconds'])
          PY
      - name: Check complete repository style
        run: |
          pre-commit run --all-files
          git diff --exit-code
          git diff --check
