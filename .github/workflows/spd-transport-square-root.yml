name: Validate SPD transport square root
on:
  push:
    branches: ['validation/spd-transport-square-root-20261116']
permissions:
  contents: read
jobs:
  correctness-and-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest ruff
      - name: Check the candidate files
        run: python -m ruff check geoopt/manifolds/symmetric_positive_definite.py tests/test_spd_transport_sqrt.py
      - name: Verify and measure unchanged upstream
        run: |
          git show 4623ea1d2a9808b8e87bf10949cccb2c5ec6233c:geoopt/manifolds/symmetric_positive_definite.py > geoopt/manifolds/symmetric_positive_definite.py
          python -m pytest -q tests/test_spd_transport_sqrt.py --junitxml=baseline.xml
          python validation/benchmark_spd_transport.py baseline.json
      - name: Verify and measure the exact candidate
        run: |
          git restore --source=8d0bbddf2f2d2fc748daea2b4500300b0840fab1 -- geoopt/manifolds/symmetric_positive_definite.py
          python -m pytest -q tests/test_spd_transport_sqrt.py tests/test_spd_distance.py tests/test_manifold_basic.py --junitxml=candidate.xml
          python validation/benchmark_spd_transport.py candidate.json
          git diff --exit-code
      - name: Compare decompositions and timings
        run: |
          python - <<'PY'
          import json
          baseline = json.load(open("baseline.json"))["results"]
          candidate = json.load(open("candidate.json"))["results"]
          for before, after in zip(baseline, candidate):
              keys = ("backward", "batch", "size")
              assert tuple(before[key] for key in keys) == tuple(after[key] for key in keys)
              assert before["eigh_calls"] == 2, before
              assert before["matrix_exp_calls"] > 0, before
              assert after["eigh_calls"] == 2, after
              assert after["matrix_exp_calls"] == 0, after
              print(json.dumps({"case": {key: before[key] for key in keys}, "before_ms": before["median_ms"], "after_ms": after["median_ms"], "speedup": before["median_ms"] / after["median_ms"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spd-transport-results
          path: |
            baseline.xml
            candidate.xml
            baseline.json
            candidate.json
