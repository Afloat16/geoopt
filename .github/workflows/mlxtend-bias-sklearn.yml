name: Validate weighted bootstrap test oracle across scikit-learn versions
on:
  push:
    branches: ['validation/mlxtend-bias-sklearn-20261116']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sklearn: ['locked', '1.9.1']
    env:
      GITHUB_ACTIONS_CI: 'true'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rasbt/mlxtend
          ref: 1aee767ef57b84a8191511a08955c583b65de382
          path: project
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install unchanged frozen dependencies
        working-directory: project
        run: uv sync --frozen --group dev --python 3.11
      - name: Install selected scikit-learn release
        if: matrix.sklearn != 'locked'
        working-directory: project
        run: uv pip install --python .venv/bin/python scikit-learn==${{ matrix.sklearn }}
      - name: Reproduce baseline and verify independent patch
        run: python .validation/validate-mlxtend-bias-sklearn.py .validation/mlxtend-bias-sklearn-payloads.json bias-variance-fresh-models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlxtend-bias-sklearn-${{ matrix.sklearn }}-validation
          path: project/.validation-results
          include-hidden-files: true
