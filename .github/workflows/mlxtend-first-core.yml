name: Validate independent mlxtend numerical fixes
on:
  push:
    branches: ['validation/mlxtend-first-core-20261116']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        candidate: [orthonormal-range, qr-rank-deficient]
    env:
      GITHUB_ACTIONS_CI: 'true'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rasbt/mlxtend
          ref: 1aee767ef57b84a8191511a08955c583b65de382
          path: project
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install unchanged frozen dependencies
        working-directory: project
        run: uv sync --frozen --group dev --python 3.11
      - name: Reproduce baseline and verify independent patch
        run: python .validation/validate-mlxtend-first.py .validation/mlxtend-first-payloads.json ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlxtend-${{ matrix.candidate }}-validation
          path: project/.validation-results
          include-hidden-files: true
