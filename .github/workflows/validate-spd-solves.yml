name: Validate SPD linear solves
on:
  push:
    branches: ['validation/spd-linear-solves-v2-20261116']
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest ruff
      - name: Check the candidate files
        run: python -m ruff check geoopt/manifolds/symmetric_positive_definite.py tests/test_spd_solve_operations.py
      - name: Verify and measure unchanged upstream
        run: |
          git show 4623ea1d2a9808b8e87bf10949cccb2c5ec6233c:geoopt/manifolds/symmetric_positive_definite.py > geoopt/manifolds/symmetric_positive_definite.py
          python -m pytest -q tests/test_spd_solve_operations.py --junitxml=baseline.xml
          python validation/benchmark_spd_solves.py baseline.json
      - name: Verify and measure the exact candidate
        run: |
          git restore --source=7367031575097c0479039c59cb02280e7a941cea -- geoopt/manifolds/symmetric_positive_definite.py
          python -m pytest -q tests/test_spd_solve_operations.py tests/test_manifold_basic.py tests/test_spd_distance.py tests/test_spd_norm.py --junitxml=candidate.xml
          python validation/benchmark_spd_solves.py candidate.json
          git diff --exit-code
      - name: Compare operation counts and timings
        run: |
          python - <<'PY'
          import json
          baseline = json.load(open("baseline.json"))["results"]
          candidate = json.load(open("candidate.json"))["results"]
          for before, after in zip(baseline, candidate):
              keys = ("name", "backward", "batch", "size")
              assert tuple(before[key] for key in keys) == tuple(after[key] for key in keys)
              assert before["inversion_calls"] > 0, before
              assert after["inversion_calls"] == 0, after
              print(before["name"], "backward", before["backward"], before["batch"], before["size"], "before_ms", before["median_ms"], "after_ms", after["median_ms"], "speedup", before["median_ms"] / after["median_ms"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spd-linear-solve-results
          path: |
            baseline.xml
            candidate.xml
            baseline.json
            candidate.json
