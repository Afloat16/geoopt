name: Validate spectral reconstruction performance
on:
  push:
    branches: ['validation/spectral-column-scaling-20261116']
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest ruff
      - name: Check the candidate files
        run: python -m ruff check geoopt/linalg/batch_linalg.py tests/test_spectral_reconstruction.py
      - name: Verify and measure unchanged upstream
        run: |
          git show 4623ea1d2a9808b8e87bf10949cccb2c5ec6233c:geoopt/linalg/batch_linalg.py > geoopt/linalg/batch_linalg.py
          python -m pytest -q tests/test_spectral_reconstruction.py --junitxml=baseline.xml
          python validation/benchmark_spectral.py baseline.json
      - name: Verify and measure the exact candidate
        run: |
          git restore --source=5491ed5069a606bf40c2c9c81f46b8a66d9dc58c -- geoopt/linalg/batch_linalg.py
          python -m pytest -q tests/test_spectral_reconstruction.py tests/test_manifold_basic.py tests/test_spd_distance.py tests/test_spd_norm.py tests/test_siegel_distance.py --junitxml=candidate.xml
          python validation/benchmark_spectral.py candidate.json
          git diff --exit-code
      - name: Compare measured operation counts and timings
        run: |
          python - <<'PY'
          import json
          baseline = json.load(open("baseline.json"))["results"]
          candidate = json.load(open("candidate.json"))["results"]
          for before, after in zip(baseline, candidate):
              assert (before["name"], before["batch"], before["size"]) == (after["name"], after["batch"], after["size"])
              assert after["diag_embed_calls"] == 0, after
              assert 2 * after["dense_matmul_calls"] == before["dense_matmul_calls"], (before, after)
              print(before["name"], before["batch"], before["size"], "before_ms", before["median_ms"], "after_ms", after["median_ms"], "speedup", before["median_ms"] / after["median_ms"], "matmuls", before["dense_matmul_calls"], after["dense_matmul_calls"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-validation-results
          path: |
            baseline.xml
            candidate.xml
            baseline.json
            candidate.json
