name: Kornia independent CPU candidate validation
on:
  push:
    branches: [validation/kornia-cpu-candidates-20261116]
permissions:
  contents: read
jobs:
  cpu:
    name: CPU units and measurements (Torch ${{ matrix.torch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.5.1', '2.15.0']
    steps:
      - uses: actions/checkout@v7
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/kornia
          ref: 2cf647172905c7260042ed9fa160547b64e579e1
          path: kornia
          fetch-depth: 2
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          working-directory: kornia
          environments: py312
          locked: true
          cache: true
      - name: Install locked dev packages and the exact CPU Torch
        working-directory: kornia
        env:
          TORCH_VERSION: ${{ matrix.torch }}
        run: pixi run -e py312 python ../validation/.validation/kornia-install-locked-cpu.py
      - name: Compare independent candidates against their exact base
        working-directory: kornia
        run: pixi run -e py312 uv run --no-sync python ../validation/.validation/kornia-validate-cpu-candidates.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kornia-cpu-${{ matrix.torch }}
          path: kornia-validation-results/
