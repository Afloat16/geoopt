name: Validate dependent spherical subspace bases
on:
  push:
    branches: ['validation/sphere-dependent-subspace-bases-20261116']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            torch: '2.0.1'
            numpy: '1.24.4'
            scipy: '1.10.1'
          - python: '3.12'
            torch: '2.6.0'
            numpy: '2.2.6'
            scipy: '1.15.3'
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} pytest==8.3.5 ruff
          python -m pip install -e . --no-deps
      - name: Lint changed files
        run: python -m ruff check geoopt/manifolds/sphere.py tests/test_sphere_dependent_basis.py
      - name: Reproduce invalid subspaces on unchanged upstream
        run: |
          git fetch --depth=1 origin 4623ea1d2a9808b8e87bf10949cccb2c5ec6233c
          git restore --source=4623ea1d2a9808b8e87bf10949cccb2c5ec6233c -- geoopt/manifolds/sphere.py
          set +e
          python -m pytest -q tests/test_sphere_dependent_basis.py --junitxml=baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("baseline.xml").getroot()
          assert len(root.findall(".//failure")) == 28, len(root.findall(".//failure"))
          assert not root.findall(".//error")
          PY
      - name: Verify exact candidate and neighboring sphere paths
        run: |
          git fetch --depth=1 origin 27287337af8582524ebc603d8d9ff6ef675a97c5
          git restore --source=27287337af8582524ebc603d8d9ff6ef675a97c5 -- geoopt/manifolds/sphere.py
          python -m pytest -q tests/test_sphere_dependent_basis.py tests/test_sphere_batched_subspace.py tests/test_sphere_subspace_tangent.py tests/test_manifold_basic.py tests/test_rsgd.py --junitxml=candidate.xml
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphere-basis-${{ matrix.python }}
          path: |
            baseline.xml
            candidate.xml
