name: Validate mixed multi-vector scoring dtypes

on:
  push:
    branches: [validation/st-mixed-mve-dtypes-20261116]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - transformers: '5.23.0'
            kernels: false
          - transformers: '5.20.0'
            kernels: true
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      PYTHONPATH: .
      ST_BASE: 9ac7fdb4edce2f1dbc171b036ecbb60383653e74
      ST_CANDIDATE: a08bf4d023f8b9b2de154a45c8dd36234044fd78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/sentence-transformers
          ref: a08bf4d023f8b9b2de154a45c8dd36234044fd78
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 transformers==${{ matrix.transformers }} huggingface-hub==2.4.0 datasets==5.2.0 accelerate==1.15.0 pytest==9.2.0 pytest-env pytest-subtests pre-commit socksio
          python -m pip install -e . --no-deps
      - name: Install matching optional kernel integration
        if: matrix.kernels
        run: python -m pip install kernels==0.17.2
      - name: Reproduce exact baseline failures
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ST_CANDIDATE"
          for source in sentence_transformers/util/similarity.py sentence_transformers/multi_vector_encoder/scoring/xtr.py; do
            git show "$ST_BASE:$source" > "$source"
          done
          set +e
          python -m pytest tests/multi_vector_encoder/test_mixed_scoring_dtypes.py -q --tb=no --junitxml=baseline.xml
          st_baseline_status=$?
          set -e
          test "$st_baseline_status" = 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          result = ET.parse('baseline.xml').getroot().find('testsuite')
          counts = {key: int(result.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('UNCHANGED BASELINE:', counts)
          assert counts == {'tests': 40, 'failures': 36, 'errors': 0, 'skipped': 0}
          PY
      - name: Restore candidate and verify regression plus adjacent paths
        run: |
          git restore --source="$ST_CANDIDATE" -- sentence_transformers/util/similarity.py sentence_transformers/multi_vector_encoder/scoring/xtr.py
          python -m pytest tests/multi_vector_encoder/test_mixed_scoring_dtypes.py tests/util/test_similarity.py tests/multi_vector_encoder/losses/test_misc.py -q --tb=short
          python -m pytest tests/multi_vector_encoder/test_model.py -k 'xtr or maxsim or colbert' -q --tb=short
      - name: Verify optional kernel integration
        if: matrix.kernels
        run: python -m pytest tests/test_kernels.py -q --tb=short
      - name: Check repository style
        run: |
          pre-commit run --all-files
          git diff --exit-code
          git diff --check
