name: Validate manifold ranking stability
on:
  push:
    branches: ['validation/pml-manifold-ranking-20261116']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: validation-source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: KevinMusgrave/pytorch-metric-learning
          ref: b95a42310f50720a766b91008470b278364f705d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.4
          python-version: '3.12'
          enable-cache: false
      - name: Install repository-pinned policy tools
        working-directory: source
        run: ./code-polishyw setup
      - name: Apply the freshly reviewed exact applicability record
        run: python3 validation-source/.validation/apply-pml-payload.py source policy
      - name: Review the unchanged locked dependency graph before installation
        working-directory: source
        run: ./code-polishyw dependency-review --base origin/master
      - name: Install the frozen development environment without builds
        working-directory: source
        run: uv sync --frozen --all-extras --no-build --no-install-project --python 3.12
      - name: Complete deferred dependency checks
        working-directory: source
        run: ./code-polishyw supply-chain
      - name: Add only regression tests to unchanged production source
        run: python3 validation-source/.validation/apply-pml-payload.py source tests
      - name: Reproduce the numerical failures on unchanged production source
        working-directory: source
        run: |
          set +e
          uv run --frozen --no-sync --env-file tests/cpu.env python -m pytest tests/losses/test_manifold_precision.py -k 'large_manifold_margin or ranking_past_double or single_proxy' --junitxml=../baseline.xml | tee ../baseline.log
          baseline_status=${PIPESTATUS[0]}
          set -e
          test "$baseline_status" -eq 1
          python3 -c 'import xml.etree.ElementTree as E; r=E.parse("../baseline.xml").getroot(); s=r.findall("testsuite"); assert sum(int(x.get("tests",0)) for x in s)==18; assert sum(int(x.get("errors",0)) for x in s)==0; assert sum(int(x.get("failures",0)) for x in s)>0'
      - name: Apply the complete numerical correction
        run: python3 validation-source/.validation/apply-pml-payload.py source all
      - name: Verify values, gradients and existing manifold contracts
        working-directory: source
        run: uv run --frozen --no-sync --env-file tests/cpu.env python -m pytest tests/losses/test_manifold_precision.py tests/losses/test_manifold_loss.py --junitxml=../candidate.xml
      - name: Run required source checks before committing
        working-directory: source
        run: ./code-polishyw check --git-changes
      - name: Commit the tested candidate inside the isolated checkout
        working-directory: source
        run: |
          git -c user.name=Afloat16 -c user.email=132809511+Afloat16@users.noreply.github.com commit -am 'Keep manifold ranking values and gradients finite'
          git show -s --format='CANDIDATE_TREE=%T%nCANDIDATE_COMMIT=%H'
      - name: Run task-scoped verification from the retained task base
        working-directory: source
        run: ./code-polishyw test --changed --base b95a42310f50720a766b91008470b278364f705d
      - name: Check all contributor formatting, typing and documentation requirements
        working-directory: source
        run: |
          uv run --frozen --no-sync ruff format --check
          uv run --frozen --no-sync ruff check
          uv run --frozen --no-sync ty check src tests docs/recipes benchmarks scripts
          uv run --frozen --no-sync mkdocs build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manifold-ranking-validation
          path: |
            baseline.xml
            baseline.log
            candidate.xml
