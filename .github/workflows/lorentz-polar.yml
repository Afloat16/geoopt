name: Validate Lorentz polar curvature
on:
  push:
    branches: ['validation/lorentz-polar-projection-curvature-20261116']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            torch: '2.0.1'
            numpy: '1.24.4'
            scipy: '1.10.1'
          - python: '3.12'
            torch: '2.6.0'
            numpy: '2.2.6'
            scipy: '1.15.3'
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} pytest==8.3.5 ruff
          python -m pip install -e . --no-deps
      - name: Lint changed files
        run: python -m ruff check geoopt/manifolds/lorentz/math.py tests/test_lorentz_polar_projection.py
      - name: Reproduce nonunit curvature mapping on unchanged upstream
        run: |
          git fetch --depth=1 origin 4623ea1d2a9808b8e87bf10949cccb2c5ec6233c
          git restore --source=4623ea1d2a9808b8e87bf10949cccb2c5ec6233c -- geoopt/manifolds/lorentz/math.py
          set +e
          python -m pytest -q tests/test_lorentz_polar_projection.py --junitxml=baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("baseline.xml").getroot()
          assert len(root.findall(".//failure")) == 24, len(root.findall(".//failure"))
          assert not root.findall(".//error")
          PY
      - name: Verify exact candidate and Lorentz geometry
        run: |
          git fetch --depth=1 origin a790cf689ab6493917b5622d96c4dee93b007f93
          git restore --source=a790cf689ab6493917b5622d96c4dee93b007f93 -- geoopt/manifolds/lorentz/math.py
          python -m pytest -q tests/test_lorentz_polar_projection.py tests/test_lorentz_math.py tests/test_lorentz_short_transport.py tests/test_lorentz_manifold_axis.py tests/test_lorentz_coordinates.py tests/test_layers_lorentz.py --junitxml=candidate.xml
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lorentz-polar-${{ matrix.python }}
          path: |
            baseline.xml
            candidate.xml
